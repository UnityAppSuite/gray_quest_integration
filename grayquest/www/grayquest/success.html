{% extends "templates/web.html" %}

{% block page_content %}
<div class="container" style="text-align: center; padding: 50px 20px;">
    <h1>{{ title or "Processing Payment..." }}</h1>
    <p>{{ message or "Please wait while we process your payment." }}</p>
    <div class="loading-spinner" style="margin: 30px auto;">
        <div style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
    </div>
    <p style="color: #666; font-size: 14px;">If you are not redirected automatically, <a href="/">click here</a>.</p>
</div>

<style>
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
{% endblock %}
